{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<section class="narrow-shell">
    <div class="app-surface form-panel">
        <div class="section-heading">
            <span class="icon-pill"><i data-lucide="log-in"></i></span>
            <div>
                <h1>Welcome back</h1>
                <p>Login to continue your health dashboard.</p>
            </div>
        </div>
        <form method="post" class="row g-3">
            <div class="col-12">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" required autocomplete="email">
            </div>
            <div class="col-12">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required autocomplete="current-password">
            </div>
            <div class="col-12 d-flex justify-content-between align-items-center">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="remember" id="remember">
                    <label class="form-check-label" for="remember">Remember me</label>
                </div>
                <a href="{{ url_for('auth.signup') }}">Create account</a>
            </div>
            <div class="col-12">
                <button class="btn btn-primary w-100" type="submit">
                    <i data-lucide="unlock"></i> Login
                </button>
            </div>
        </form>
        <div class="demo-note mt-3">
            Demo admin: admin@example.com / Admin@12345
        </div>
    </div>
</section>
{% endblock %}
